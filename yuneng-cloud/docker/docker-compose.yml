version : '3.8'
networks:
  cloud-net:
    name: cloud-net
    ipam:
      config:
        - subnet: 172.18.0.0/16
services:
  hcp-rocketmq-permissions:
    image: apache/rocketmq:4.9.7
    user: root
    restart: "no"
    command: sh -c 'chown rocketmq:rocketmq /data/namesrv-logs /data/broker-logs /data/broker-store'
    volumes:
      - rocketmq-namesrv-logs:/data/namesrv-logs
      - rocketmq-broker-logs:/data/broker-logs
      - rocketmq-broker-store:/data/broker-store
    network_mode: none
  hcp-rocketmq-namesrv:
    container_name: hcp-rocketmq-namesrv
    image: apache/rocketmq:4.9.7
    restart: unless-stopped
    depends_on:
      hcp-rocketmq-permissions:
        condition: service_completed_successfully
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      cloud-net:
        ipv4_address: 172.18.0.20
  hcp-rocketmq-broker:
    container_name: hcp-rocketmq-broker
    image: apache/rocketmq:4.9.7
    restart: unless-stopped
    depends_on:
      hcp-rocketmq-permissions:
        condition: service_completed_successfully
      hcp-rocketmq-namesrv:
        condition: service_healthy
    environment:
      # JDK 8u372 in this image misreads cgroup v2 on recent Docker Desktop.
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m -XX:-UseContainerSupport"
    command: sh mqbroker -c /home/rocketmq/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin brokerStatus -n hcp-rocketmq-namesrv:9876 -b 172.18.0.19:10911 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
    networks:
      cloud-net:
        ipv4_address: 172.18.0.19
  hcp-rocketmq-init:
    image: apache/rocketmq:4.9.7
    restart: "no"
    depends_on:
      hcp-rocketmq-broker:
        condition: service_healthy
    environment:
      JAVA_OPT_EXT: "-Xms64m -Xmx128m"
    command: sh -c 'sh mqadmin updateTopic -n hcp-rocketmq-namesrv:9876 -b 172.18.0.19:10911 -t charge-points -r 4 -w 4 && sh mqadmin updateTopic -n hcp-rocketmq-namesrv:9876 -b 172.18.0.19:10911 -t charge-device-alarm -r 4 -w 4'
    networks:
      cloud-net:
        ipv4_address: 172.18.0.22
  hcp-nacos:
    container_name: hcp-nacos
    image: nacos/nacos-server:2.0.3-slim
    build:
      context: ./nacos
    environment:
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - hcp-mysql
    networks:
      cloud-net:
        ipv4_address: 172.18.0.6
  hcp-mysql:
    container_name: hcp-mysql
    image: mysql:8.0.36
    build:
      context: ./mysql
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data8:/var/lib/mysql
      - ./mysql/db:/docker-entrypoint-initdb.d
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1'
    ]
    environment:
      MYSQL_DATABASE: 'vctgo_platform'
      MYSQL_ROOT_PASSWORD: password
    networks:
      cloud-net:
        ipv4_address: 172.18.0.2
  hcp-redis:
    container_name: hcp-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/hcp/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/hcp/redis/redis.conf
    networks:
      cloud-net:
        ipv4_address: 172.18.0.3
  hcp-nginx:
    container_name: hcp-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "8001:80"
    volumes:
      - ./nginx/html/dist:/home/hcp/projects/hcp-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - hcp-gateway
    links:
      - hcp-gateway
    networks:
      cloud-net:
        ipv4_address: 172.18.0.4
  hcp-gateway:
    container_name: hcp-gateway
    build:
      context: hcp/gateway
      dockerfile: dockerfile
    ports:
      - "38080:38080"
    depends_on:
      - hcp-redis
    links:
      - hcp-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.5
  hcp-auth:
    container_name: hcp-auth
    build:
      context: hcp/auth
      dockerfile: dockerfile
    ports:
      - "39200:39200"
    depends_on:
      - hcp-redis
    links:
      - hcp-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.7
  hcp-system:
    container_name: hcp-system
    build:
      context: hcp/modules/system
      dockerfile: dockerfile
    ports:
      - "39201:39201"
    depends_on:
      - hcp-redis
      - hcp-mysql
    links:
      - hcp-redis
      - hcp-mysql
      - hcp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.8
  hcp-gen:
    container_name: hcp-gen
    build:
      context: hcp/modules/gen
      dockerfile: dockerfile
    ports:
      - "39202:39202"
    depends_on:
      - hcp-mysql
    links:
      - hcp-mysql
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.9
  hcp-file:
    container_name: hcp-file
    build:
      context: hcp/modules/file
      dockerfile: dockerfile
    ports:
      - "39300:39300"
    volumes:
      - ./vctgo/uploadPath:/home/hcp/uploadPath
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.10
  hcp-monitor:
    container_name: hcp-monitor
    build:
      context: hcp/visual/monitor
      dockerfile: dockerfile
    ports:
      - "39100:39100"
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.11
  hcp-demo:
    container_name: hcp-demo
    build:
      context: hcp/demo
      dockerfile: dockerfile
    ports:
      - "39203:39203"
    depends_on:
      - hcp-redis
      - hcp-mysql
    links:
      - hcp-redis
      - hcp-mysql
      - hcp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.12
  hcp-job:
    container_name: hcp-job
    build:
      context: hcp/modules/job
      dockerfile: dockerfile
    ports:
      - "39204:39204"
    depends_on:
      - hcp-redis
      - hcp-mysql
    links:
      - hcp-redis
      - hcp-mysql
      - hcp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${NETWORK_IP:-127.0.0.1}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.13
  hcp-operator:
    container_name: hcp-operator
    build:
      context: hcp/modules/operator
      dockerfile: dockerfile
    ports:
      - "39206:39206"
    depends_on:
      hcp-nacos:
        condition: service_healthy
      hcp-mysql:
        condition: service_healthy
      hcp-redis:
        condition: service_started
      hcp-rocketmq-init:
        condition: service_completed_successfully
    environment:
      - HCP_ALARM_MQ_ENABLED=true
      - HCP_ALARM_MQ_NAME_SERVER=hcp-rocketmq-namesrv:9876
      - HCP_POINTS_MQ_ENABLED=true
      - HCP_POINTS_MQ_NAME_SERVER=hcp-rocketmq-namesrv:9876
      - NACOS_HOST=hcp-nacos
      - NACOS_PORT=8848
    networks:
      cloud-net:
        ipv4_address: 172.18.0.14
  hcp-mp:
    container_name: hcp-mp
    build:
      context: hcp/modules/mp
      dockerfile: dockerfile
    ports:
      - "39207:39207"
    depends_on:
      hcp-nacos:
        condition: service_healthy
      hcp-mysql:
        condition: service_healthy
      hcp-redis:
        condition: service_started
      hcp-rocketmq-init:
        condition: service_completed_successfully
    environment:
      - HCP_POINTS_MQ_ENABLED=true
      - HCP_POINTS_MQ_NAME_SERVER=hcp-rocketmq-namesrv:9876
      - NACOS_HOST=hcp-nacos
      - NACOS_PORT=8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=hcp
    networks:
      cloud-net:
        ipv4_address: 172.18.0.15
  hcp-simulator:
    container_name: hcp-simulator
    build:
      context: hcp/modules/simulator
      dockerfile: dockerfile
    ports:
      - "39208:39208"
    depends_on:
      - hcp-nacos
      - hcp-mysql
      - hcp-redis
    environment:
      - NACOS_HOST=hcp-nacos
      - NACOS_PORT=8848
    networks:
      cloud-net:
        ipv4_address: 172.18.0.16
volumes:
  rocketmq-namesrv-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
